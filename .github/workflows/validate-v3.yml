name: Validate 3.0 preview

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and manifest
        shell: bash
        run: |
          set -euo pipefail
          find extension-v3 -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "const m=require('./extension-v3/manifest.json'); if(m.manifest_version!==3||!m.side_panel||!m.background.type) process.exit(1); console.log('manifest', m.version)"

      - name: Run adapter and core tests
        run: node --test tests/v3/platforms.test.mjs tests/v3/core.test.mjs tests/v3/package.test.mjs tests/v3/prune.test.mjs tests/v3/memory.test.mjs tests/v3/sidepanel-smoke.test.mjs
