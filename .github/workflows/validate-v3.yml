name: Validate AI Chat Vault 3.0

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and manifest
        shell: bash
        run: |
          set -euo pipefail
          find extension-v3 -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "const m=require('./extension-v3/manifest.json'); if(m.manifest_version!==3||!m.side_panel||!m.background.type) process.exit(1); for (const l of ['en','uk']) { const d=require('./extension-v3/_locales/'+l+'/messages.json').extensionDescription.message; if (d.length>132) { console.error(l,'description too long'); process.exit(1); } } console.log('manifest', m.version)"

      - name: Run adapter and core tests
        shell: bash
        run: node --test tests/v3/*.test.mjs
