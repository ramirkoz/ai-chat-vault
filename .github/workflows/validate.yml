name: Validate extension

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GPT Project & Memory Tools 2.26.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['manifest_version'] == 3
          assert manifest['name'] == 'GPT Project & Memory Tools'
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'storage']
          assert manifest['optional_host_permissions'] == ['https://chatgpt.com/*', 'https://chat.openai.com/*']
          assert manifest['background']['service_worker'] == 'background-entry.js'
          assert manifest['action']['default_popup'] == 'popup-entry.html'

          required = [
              'background.js', 'background-entry.js', 'popup.js', 'popup.css',
              'popup-entry.html', 'popup-router.js', 'sidepanel.html', 'sidepanel.css',
              'site-tools.html', 'site-tools.css', 'site-tools.js',
              'thread-workspace.js', 'thread-workspace.css', 'workspace-bulk-export.js',
              'html-export.js', 'language-export.js', 'pdf-export.js', 'package-export.js',
              'package-export-complete.js', 'project-memory-agent.js', 'project-memory-background.js',
              'zip-safe-hotfix.js', 'print.html', 'print.css', 'print.js',
              'selected-text-handoff-background.js', 'screenshot-handoff-background.js',
              'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png', 'icons/icon128.png'
          ]
          for name in required:
              assert (root / name).is_file(), name
          print('Manifest and package structure: PASS')
          PY

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -type f -name '*.js' -print0)

          rm -f /tmp/gpt-project-memory-tools.zip
          (cd extension && zip -qr /tmp/gpt-project-memory-tools.zip .)
          unzip -t /tmp/gpt-project-memory-tools.zip
          unzip -Z1 /tmp/gpt-project-memory-tools.zip | grep -qx 'manifest.json'
          unzip -Z1 /tmp/gpt-project-memory-tools.zip | grep -qx 'package-export-complete.js'
          unzip -Z1 /tmp/gpt-project-memory-tools.zip | grep -qx 'project-memory-agent.js'
          unzip -Z1 /tmp/gpt-project-memory-tools.zip | grep -qx 'project-memory-background.js'
