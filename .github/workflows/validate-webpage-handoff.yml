name: Validate webpage handoff

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate webpage handoff
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/webpage-to-chatgpt.js

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          html = (root / 'popup.html').read_text()
          css = (root / 'popup.css').read_text()
          js = (root / 'webpage-to-chatgpt.js').read_text()
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'storage']
          assert 'host_permissions' not in manifest
          assert 'https://chatgpt.com/*' in manifest['optional_host_permissions']

          for marker in (
              'id="webpage-handoff"',
              'id="send-webpage-to-chatgpt"',
              'data-i18n="sendWebpageHeading"',
              'data-i18n="sendWebpageDescription"',
              'data-i18n="sendWebpageButton"',
              'src="webpage-to-chatgpt.js"',
          ):
              assert marker in html, marker

          for marker in (
              "const CHATGPT_ORIGIN = 'https://chatgpt.com/*'",
              'MAX_HANDOFF_LENGTH = 30000',
              'MAX_PAGE_TEXT_LENGTH = 27000',
              'chrome.permissions.request',
              'chrome.tabs.query',
              'chrome.scripting.executeScript',
              'extractReadableWebpage',
              'buildHandoffText',
              "type: 'insert-selected-text'",
              "'article, main, [role=\"main\"]",
              'removableSelectors',
              'webpageTruncatedNote',
          ):
              assert marker in js, marker

          for forbidden in (
              'requestSubmit(',
              '.submit(',
              'send-button',
          ):
              assert forbidden not in js, forbidden

          for marker in (
              '.webpage-handoff',
              '.send-webpage-button',
              '.send-webpage-button:hover',
          ):
              assert marker in css, marker

          required_messages = {
              'sendWebpageHeading',
              'sendWebpageDescription',
              'sendWebpageButton',
              'webpageReadingStatus',
              'webpageUnavailableError',
              'webpageEmptyError',
              'webpageTooLongError',
              'webpageInsertedStatus',
              'webpagePromptTitle',
              'webpagePromptSource',
              'webpagePromptContent',
              'webpageTruncatedNote',
          }

          for locale in ('en', 'uk'):
              messages = json.loads((root / '_locales' / locale / 'messages.json').read_text())
              missing = sorted(required_messages - messages.keys())
              assert not missing, f'{locale} missing webpage translations: {missing}'

          print('Webpage handoff validation: PASS')
          PY
