name: Validate thread navigation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate searchable thread contents
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/popup.js
          node --check extension/search-navigation.js
          node --check extension/navigation-highlight-fix.js
          node --check extension/role-filter.js

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          html = (root / 'popup.html').read_text()
          css = (root / 'popup.css').read_text()
          js = (root / 'popup.js').read_text()
          search_js = (root / 'search-navigation.js').read_text()
          highlight_js = (root / 'navigation-highlight-fix.js').read_text()
          role_filter_js = (root / 'role-filter.js').read_text()
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'storage']
          assert 'host_permissions' not in manifest

          for marker in (
              'id="message-search"',
              'data-i18n-placeholder="searchMessagesPlaceholder"',
              'id="search-count"',
              'data-i18n="tocHeading"',
              'id="role-filter"',
              'data-role-filter="all"',
              'data-role-filter="user"',
              'data-role-filter="assistant"',
              'id="previous-search-result"',
              'id="next-search-result"',
              'id="search-position"',
              'src="navigation-highlight-fix.js"',
              'src="role-filter.js"',
              'src="search-navigation.js"',
          ):
              assert marker in html, marker

          for marker in (
              'applyMessageFilter',
              'normalizeSearchText',
              'navigateToMessage',
              'scrollToConversationMessage',
              'scrollIntoView',
              'data-message-author-role',
              'message-open',
              'searchResultCount',
          ):
              assert marker in js, marker

          for marker in (
              'navigateSearchResult',
              'previous-search-result',
              'next-search-result',
              'searchPosition',
              "event.key !== 'Enter'",
              'event.shiftKey ? -1 : 1',
              'MutationObserver',
              'search-current',
          ):
              assert marker in search_js, marker

          for marker in (
              'clearNavigationHighlights',
              'data-thread-export-navigation-highlight',
              'threadExportNavigationToken',
              'locateConversationMessage',
              'descriptorFor',
          ):
              assert marker in highlight_js, marker

          for marker in (
              'applyRoleFilter',
              'roleForItem',
              'data-role-filter',
              "activeRole = 'all'",
              'aria-pressed',
              'roleFilterLabel',
              'roleFilterAssistant',
          ):
              assert marker in role_filter_js, marker

          for marker in (
              '.navigation-tools',
              '.search-field',
              '.toc-summary',
              '.role-filter',
              '.role-filter-button',
              '.role-filter-button.active',
              '.result-navigation',
              '.result-nav-button',
              '#search-position',
              '.message-number',
              '.message-open',
              '.message-item.search-current',
              '.empty-search',
          ):
              assert marker in css, marker

          required_messages = {
              'searchMessagesLabel',
              'searchMessagesPlaceholder',
              'roleFilterLabel',
              'roleFilterAll',
              'roleFilterUser',
              'roleFilterAssistant',
              'tocHeading',
              'searchResultCount',
              'noSearchResults',
              'searchNavigationLabel',
              'previousSearchResult',
              'nextSearchResult',
              'searchPosition',
              'openMessageButton',
              'navigatingStatus',
              'messageOpenedStatus',
              'messageNotFoundError',
              'emptyMessagePreview',
          }

          for locale in ('en', 'uk'):
              messages = json.loads((root / '_locales' / locale / 'messages.json').read_text())
              missing = sorted(required_messages - messages.keys())
              assert not missing, f'{locale} missing navigation translations: {missing}'

          print('Thread navigation validation: PASS')
          PY
