name: Validate screenshot handoff

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate screenshot handoff
        shell: bash
        run: |
          set -euo pipefail
          node --check extension/screenshot-to-chatgpt.js
          node --check extension/screenshot-handoff-background.js

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('extension')
          manifest = json.loads((root / 'manifest.json').read_text())
          html = (root / 'popup.html').read_text()
          css = (root / 'screenshot-handoff.css').read_text()
          popup_js = (root / 'screenshot-to-chatgpt.js').read_text()
          background_js = (root / 'screenshot-handoff-background.js').read_text()
          background_entry = (root / 'background-entry.js').read_text()
          assert manifest['permissions'] == ['activeTab', 'scripting', 'downloads', 'storage']
          assert 'host_permissions' not in manifest
          assert 'https://chatgpt.com/*' in manifest['optional_host_permissions']

          for marker in (
              'href="screenshot-handoff.css"',
              'id="screenshot-handoff"',
              'id="send-screenshot-to-chatgpt"',
              'data-i18n="sendScreenshotHeading"',
              'data-i18n="sendScreenshotDescription"',
              'data-i18n="sendScreenshotButton"',
              'src="screenshot-to-chatgpt.js"',
          ):
              assert marker in html, marker

          for marker in (
              "const CHATGPT_ORIGIN = 'https://chatgpt.com/*'",
              'chrome.permissions.request',
              'chrome.tabs.captureVisibleTab',
              "format: 'jpeg'",
              'quality: 92',
              "type: 'insert-screenshot'",
              'MAX_SCREENSHOT_DATA_URL_LENGTH = 12000000',
          ):
              assert marker in popup_js, marker

          for marker in (
              "message?.type !== 'insert-screenshot'",
              'handleScreenshotHandoff',
              'chrome.permissions.contains',
              "url: 'https://chatgpt.com/'",
              'active: false',
              'chrome.scripting.executeScript',
              'attachScreenshotToChatGpt',
              'new File(',
              'new DataTransfer()',
              'input[type="file"]',
              "new ClipboardEvent('paste'",
              'chrome.tabs.update',
              'clearComposer',
              'composerText',
              'settleImageOnlyComposer',
              'deleteContentBackward',
              "setter.call(element, '')",
              'element.replaceChildren()',
              'await settleImageOnlyComposer()',
              'imageOnly: true',
          ):
              assert marker in background_js, marker

          assert "importScripts('screenshot-handoff-background.js')" in background_entry

          for forbidden in (
              'requestSubmit(',
              '.submit(',
              'send-button',
              "type: 'insert-selected-text'",
              'extractReadableWebpage',
              'buildHandoffText',
          ):
              assert forbidden not in background_js, forbidden

          for marker in (
              '.screenshot-handoff',
              '.send-screenshot-button',
              '.send-screenshot-button:hover',
          ):
              assert marker in css, marker

          required_messages = {
              'sendScreenshotHeading',
              'sendScreenshotDescription',
              'sendScreenshotButton',
              'screenshotCapturingStatus',
              'screenshotUnavailableError',
              'screenshotTooLargeError',
              'screenshotAttachmentError',
              'screenshotInsertedStatus',
          }

          for locale in ('en', 'uk'):
              messages = json.loads((root / '_locales' / locale / 'messages.json').read_text())
              missing = sorted(required_messages - messages.keys())
              assert not missing, f'{locale} missing screenshot translations: {missing}'

          print('Screenshot handoff validation: PASS')
          PY
